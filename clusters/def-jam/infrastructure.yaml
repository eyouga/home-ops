# Three layers. CRDs first: Traefik's chart creates a Gateway, so the
# Gateway API CRDs must exist before it installs, and the controllers ship
# ServiceMonitors, so the Prometheus Operator's CRDs must too. configs/ last:
# it creates objects (IPAddressPool, ClusterIssuer, Certificate) whose CRDs
# only exist once controllers/ is ready.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: gateway-api
  namespace: flux-system
spec:
  interval: 24h
  url: https://github.com/kubernetes-sigs/gateway-api
  # The version Traefik's chart asks for (42.x: v1.6.3).
  ref:
    tag: v1.6.3
  ignore: |
    /*
    !/config/crd/standard/
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-crds
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: gateway-api
  path: ./config/crd/standard
  # Deleting a CRD deletes every object of that kind: never prune these.
  prune: false
  wait: true
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: prometheus-operator
  namespace: flux-system
spec:
  interval: 24h
  url: https://github.com/prometheus-operator/prometheus-operator
  # The operator version monitoring/'s kube-prometheus-stack runs (92.17.0:
  # v0.94.2). Bump both together.
  ref:
    tag: v0.95.1
  ignore: |
    /*
    !/example/prometheus-operator-crd/
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-crds-prometheus
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: prometheus-operator
  path: ./example/prometheus-operator-crd
  prune: false
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-controllers
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-crds
    - name: infra-crds-prometheus
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/controllers
  prune: true
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-configs
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-controllers
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/configs
  prune: true
  wait: true
  # The Cloudflare token lives here (cert-manager), SOPS-encrypted.
  decryption:
    provider: sops
    secretRef:
      name: sops-age
