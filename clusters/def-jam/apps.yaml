apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-configs
  interval: 1h
  retryInterval: 1m
  # wait: true checks every app's health within this, so it outlasts the longest
  # HelmRelease timeout (Jellyfin's and Nextcloud's 35m): a slow migration is
  # still in progress, not a failure. scripts/ci/shape.sh checks it.
  timeout: 40m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
