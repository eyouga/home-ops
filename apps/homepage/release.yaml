# homepage, the landing page at the apex (Phase 8 puts it behind the SSO). The
# old server's install was never set up (the image's samples), so nothing was
# carried over: the whole configuration is config/ in git (settings, services,
# widgets, bookmarks), with no state and no PVC. uid 568 and a read-only root;
# /app/config is an emptyDir because homepage copies skeletons of the files it
# doesn't find there (docker.yaml, kubernetes.yaml, ...), all left empty.
#
# Left out on purpose: the old chart's `kubernetes.yaml: mode: cluster` and its
# cluster-wide read access to pods, nodes and ingresses: nothing here uses them,
# so the pod gets no API token.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homepage
  namespace: homepage
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      homepage:
        strategy: Recreate
        pod:
          automountServiceAccountToken: false
          # services.yaml's siteMonitor checks go through Traefik, as a browser
          # on the LAN would (from a pod these names would go to public DNS).
          hostAliases:
            - ip: 192.168.1.201
              hostnames:
                - jellyfin.eyouga.fr
                - seerr.eyouga.fr
                - sonarr.eyouga.fr
                - radarr.eyouga.fr
                - lidarr.eyouga.fr
                - prowlarr.eyouga.fr
                - transmission.eyouga.fr
                - nextcloud.eyouga.fr
                - homeassistant.eyouga.fr
                - git.eyouga.fr
                - grafana.eyouga.fr
                - prometheus.eyouga.fr
                - alertmanager.eyouga.fr
                - auth.eyouga.fr
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            seccompProfile:
              type: RuntimeDefault
        containers:
          app:
            image:
              repository: ghcr.io/gethomepage/homepage
              tag: v2.7.0@sha256:19c5c09184458a41b7b5915e71463a39f36cd33540f41bdbed008791b8182d5f
            env:
              TZ: Europe/Paris
              # Required since v1: requests for any other Host are refused.
              HOMEPAGE_ALLOWED_HOSTS: eyouga.fr
              # No logs/ directory under /app/config.
              LOG_TARGETS: stdout
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/healthcheck
                    port: 3000
                    # Probes come with the pod's IP as Host, which
                    # HOMEPAGE_ALLOWED_HOSTS would refuse.
                    httpHeaders:
                      - name: Host
                        value: eyouga.fr
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probe
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]

    service:
      app:
        controller: homepage
        ports:
          http:
            port: 3000

    persistence:
      config:
        type: emptyDir
        globalMounts:
          - path: /app/config
      settings:
        type: configMap
        name: homepage-config
        globalMounts:
          - { path: /app/config/settings.yaml, subPath: settings.yaml, readOnly: true }
          - { path: /app/config/services.yaml, subPath: services.yaml, readOnly: true }
          - { path: /app/config/widgets.yaml, subPath: widgets.yaml, readOnly: true }
          - { path: /app/config/bookmarks.yaml, subPath: bookmarks.yaml, readOnly: true }
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
