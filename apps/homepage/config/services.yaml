# siteMonitor is checked by homepage itself, through Traefik (release.yaml's
# hostAliases, the NetworkPolicy's egress to 8443), so a green dot means the
# route, the certificate and the app all work.
- Médias:
    - Jellyfin:
        icon: jellyfin.png
        href: https://jellyfin.eyouga.fr
        description: Films, séries, musique
