apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - networkpolicy.yaml
  - storage.yaml
  - release.yaml
# Hashed name, so editing a file in config/ upgrades the HelmRelease (the next
# dump runs it); kustomizeconfig.yaml carries the hash into it.
configMapGenerator:
  - name: pg-dump-files
    namespace: databases
    files:
      - config/pg-dump.sh
configurations:
  - kustomizeconfig.yaml
