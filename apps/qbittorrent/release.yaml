# qBittorrent at the old server's exact image (Phase 5: restore first,
# upgrade in Phase 6). Config and the 48 torrents' resume data from the
# rescued /mnt/Bim/apps/qbittorrent/config; uid 568 like on TrueNAS. Every
# torrent saves under /torrents, the same path as before. WebUI stays on
# 10095: the *arrs and Prowlarr have that port in their settings. Restored
# with queueing on and 0 active slots, so nothing talks to peers until the
# limits are raised in its UI.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qbittorrent
  namespace: qbittorrent
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  # Restore window only: Helm would wait for the config PVC to bind, which
  # needs a pod. Removed together with replicas: 0.
  install:
    disableWait: true
  values:
    controllers:
      qbittorrent:
        # 0 while the config is restored into the empty PVC; then 1.
        replicas: 0
        strategy: Recreate
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            seccompProfile:
              type: RuntimeDefault
        containers:
          app:
            image:
              repository: ghcr.io/onedr0p/qbittorrent
              tag: 4.6.5@sha256:c019af23966ebafcaf1713d4553bc043246858b711a7d57d8bee358a89990a3e
            env:
              TZ: Europe/Paris
              QBITTORRENT__PORT: 10095
              QBT_BitTorrent__Session__Port: 6881
              QBT_Preferences__Connection__PortRangeMin: 6881
              QBT_Preferences__WebUI__Address: "*"
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 10095
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probe
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]

    service:
      app:
        controller: qbittorrent
        ports:
          http:
            port: 10095
      # Peers. Its own fixed IP; reachable from outside only if the router
      # forwards 6881 to it.
      torrent:
        controller: qbittorrent
        type: LoadBalancer
        annotations:
          metallb.io/loadBalancerIPs: 192.168.1.203
        externalTrafficPolicy: Local
        ports:
          torrent-tcp:
            port: 6881
            protocol: TCP
          torrent-udp:
            port: 6881
            protocol: UDP

    persistence:
      config:
        type: persistentVolumeClaim
        storageClass: fast
        accessMode: ReadWriteOnce
        size: 1Gi
        retain: true
        globalMounts:
          - path: /config
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      # storage.yaml
      torrents:
        existingClaim: torrents
        globalMounts:
          - path: /torrents
