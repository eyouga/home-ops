# Bulk data on tank, mounted from the host (datasets in the dotfiles'
# zfs.nix). Static PVs, so the pods stay on Pod Security `restricted` (a
# hostPath in the pod spec would not). type: Directory: until tank is
# imported the path is missing, so the pod waits instead of writing into
# the wiped root. Retain: deleting these never touches the files. The
# capacity is a label; nothing enforces it.
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: qbittorrent-torrents
spec:
  capacity:
    storage: 1Ti
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: qbittorrent
    name: torrents
  hostPath:
    path: /srv/torrents
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: torrents
  namespace: qbittorrent
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: qbittorrent-torrents
  resources:
    requests:
      storage: 1Ti
