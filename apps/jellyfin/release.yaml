# Jellyfin at the old server's exact image (Phase 5: restore first, upgrade
# in Phase 6). Config from the rescued jellyfin-config PVC; uid 568 like on
# TrueNAS. The libraries point at /media/{films,series,music}, the old paths:
# tank/data's media/ mounted read-only there (storage.yaml), since the *arrs
# own the library. Transcodes and cache are scratch
# (emptyDir), as before. The RTX 2070 is passed in through the nvidia-cdi
# runtime; NVENC + NVDEC are set in Jellyfin's playback settings (the old
# server transcoded on the CPU; switched 2026-11-01).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      jellyfin:
        strategy: Recreate
        pod:
          # Jellyfin's server name defaults to the hostname; a fixed one
          # keeps it from changing with every pod.
          hostname: jellyfin
          runtimeClassName: nvidia-cdi
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            seccompProfile:
              type: RuntimeDefault
        containers:
          app:
            image:
              repository: ghcr.io/jellyfin/jellyfin
              tag: 10.9.11@sha256:fc1b51f4be3fba725e42dae2022d9c6a5b069acce01bef04d32fdee025dc511e
            env:
              TZ: Europe/Paris
              JELLYFIN_PublishedServerUrl: https://jellyfin.eyouga.fr
              # NVENC/NVDEC need the driver's video libraries in the container.
              NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8096
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probe
              # A start after an upgrade runs the database migrations first,
              # and killing the pod mid-migration can leave the database
              # half-converted (10.11's notes: "DO NOT CANCEL OR INTERRUPT").
              # 30 minutes, far more than this library needs.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8096
                  periodSeconds: 10
                  failureThreshold: 180
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 8Gi
                nvidia.com/gpu: 1
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]

    service:
      app:
        controller: jellyfin
        ports:
          http:
            port: 8096

    persistence:
      config:
        type: persistentVolumeClaim
        storageClass: fast
        accessMode: ReadWriteOnce
        size: 10Gi
        retain: true
        globalMounts:
          - path: /config
      transcodes:
        type: emptyDir
        globalMounts:
          - path: /config/transcodes
      cache:
        type: emptyDir
        globalMounts:
          - path: /cache
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      # storage.yaml
      tank-data:
        existingClaim: tank-data
        globalMounts:
          - path: /media
            subPath: media
            readOnly: true
