# Jellyfin. uid 568 owns its config. The libraries point at
# /media/{films,series,music}: its database holds those paths, so tank/data's
# media/ is mounted read-only there (storage.yaml), since the *arrs own the
# library. Transcodes and cache are scratch (emptyDir). The RTX 2070 is passed
# in through the nvidia-cdi runtime; NVENC + NVDEC are set in Jellyfin's
# playback settings.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  interval: 1h
  # The startup probe allows 30 minutes (library migration); 5 more to pull the image.
  timeout: 35m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      jellyfin:
        strategy: Recreate
        pod:
          # Jellyfin's server name defaults to the hostname; a fixed one
          # keeps it from changing with every pod.
          hostname: jellyfin
          runtimeClassName: nvidia-cdi
          # The issuer the SSO plugin checks, reached through Traefik.
          hostAliases:
            - ip: 192.168.1.201
              hostnames: [auth.eyouga.fr]
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            seccompProfile:
              type: RuntimeDefault
        initContainers:
          sso:
            image:
              repository: docker.io/library/python
              tag: 3.15-alpine@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd
            command: [python3, -B, /files/install-sso.py]
            env:
              OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: jellyfin-oidc
                    key: client-secret
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
        containers:
          app:
            image:
              repository: ghcr.io/jellyfin/jellyfin
              tag: 12.4@sha256:fea863d0cd9ec445985d9c75fc6ed64e38a1d2766cf0c250a33d553f4fc1b771
            env:
              TZ: Europe/Paris
              JELLYFIN_PublishedServerUrl: https://jellyfin.eyouga.fr
              # NVENC/NVDEC need the driver's video libraries in the container.
              NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8096
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probe
              # A start after an upgrade runs the database migrations first,
              # and killing the pod mid-migration can leave the database
              # half-converted (10.11's notes: "DO NOT CANCEL OR INTERRUPT").
              # 30 minutes, far more than this library needs.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8096
                  periodSeconds: 10
                  failureThreshold: 180
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 8Gi
                nvidia.com/gpu: 1
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]

    service:
      app:
        controller: jellyfin
        ports:
          http:
            port: 8096

    persistence:
      # config/ (kustomization.yaml's configMapGenerator), for the init container.
      files:
        type: configMap
        name: jellyfin-files
        advancedMounts:
          jellyfin:
            sso:
              - path: /files
                readOnly: true
      config:
        type: persistentVolumeClaim
        storageClass: fast
        accessMode: ReadWriteOnce
        size: 10Gi
        retain: true
        globalMounts:
          - path: /config
      transcodes:
        type: emptyDir
        globalMounts:
          - path: /config/transcodes
      cache:
        type: emptyDir
        globalMounts:
          - path: /cache
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      # storage.yaml
      tank-data:
        existingClaim: tank-data
        globalMounts:
          - path: /media
            subPath: media
            readOnly: true
