# jellyfin.eyouga.fr, as on the old server. LAN only until Phase 8 (public DNS
# doesn't point here; blocky does).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames: [jellyfin.eyouga.fr]
  rules:
    - backendRefs:
        - name: jellyfin
          port: 8096
