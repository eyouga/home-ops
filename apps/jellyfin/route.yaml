# jellyfin.eyouga.fr, as on the old server.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
    # From the internet too (Traefik's release.yaml, and this namespace's label).
    - name: traefik-gateway
      namespace: traefik
      sectionName: public
  hostnames: [jellyfin.eyouga.fr]
  rules:
    - backendRefs:
        - name: jellyfin
          port: 8096
