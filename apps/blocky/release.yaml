# LAN DNS: ad blocking, and eyouga.fr answered locally with Traefik's IP
# (replaces the old k8s_gateway). Stateless; written fresh for the current
# version (the old 0.23 config schema is gone). The config is config.yml,
# shared with the second blocky on the Freebox. One replica, no Redis: Redis
# only syncs the cache and blocking state between replicas.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blocky
  namespace: blocky
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      blocky:
        strategy: RollingUpdate
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 100
            seccompProfile:
              type: RuntimeDefault
        containers:
          app:
            image:
              repository: ghcr.io/0xerr0r/blocky
              tag: v0.35.0@sha256:4f165b63db0d76c96ecc47c7a8f57caeedc003a912bdce29abb0e283ce02e16b
            env:
              BLOCKY_CONFIG_FILE: /config/config.yml
            probes:
              # `blocky healthcheck` resolves a name against its own DNS
              # port, read from the config.
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  exec:
                    command: [/app/blocky, healthcheck]
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probe
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]

    service:
      dns:
        controller: blocky
        type: LoadBalancer
        annotations:
          metallb.io/loadBalancerIPs: 192.168.1.202
        # Keep the client's address: blocky's logs and client groups see the
        # real LAN host instead of the node. One node, so nothing is lost.
        externalTrafficPolicy: Local
        ports:
          dns-udp:
            port: 53
            targetPort: 5353
            protocol: UDP
          dns-tcp:
            port: 53
            targetPort: 5353
            protocol: TCP
      http:
        controller: blocky
        ports:
          http:
            port: 4000

    serviceMonitor:
      blocky:
        serviceName: blocky-http
        endpoints:
          - port: http
            path: /metrics
            interval: 1m

    persistence:
      config:
        type: configMap
        # Generated from config.yml (kustomization.yaml); kustomizeconfig.yaml
        # swaps in the hashed name, so a config edit rolls the pod.
        name: blocky-config
        globalMounts:
          - path: /config
            readOnly: true
