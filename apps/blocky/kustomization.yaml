apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - networkpolicy.yaml
  - repository.yaml
  - release.yaml
# Hashed name, so editing config.yml upgrades the HelmRelease and rolls the
# pod; kustomizeconfig.yaml carries the hash into its persistence.
configMapGenerator:
  - name: blocky-config
    namespace: blocky
    files: [config.yml]
configurations:
  - kustomizeconfig.yaml
