apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - networkpolicy.yaml
  - release.yaml
# Hashed name, so editing a file in config/ upgrades the HelmRelease and rolls
# the pod; kustomizeconfig.yaml carries the hash into it.
configMapGenerator:
  - name: blocky-files
    namespace: blocky
    files: [config/config.yml]
configurations:
  - kustomizeconfig.yaml
