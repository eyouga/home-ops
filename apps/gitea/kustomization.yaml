apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - networkpolicy.yaml
  - repository.yaml
  # The `gitea` role's password, twice: for CNPG in `databases`, for the app
  # in `gitea`. Same value in both.
  - db-credentials.sops.yaml
  - credentials.sops.yaml
  # The client secret Authelia knows as `forgejo`.
  - oidc.sops.yaml
  # SECRET_KEY and the /metrics token, from the environment.
  - secrets.sops.yaml
  - database.yaml
  - release.yaml
  - route.yaml
