# Gitea's Postgres, in the `databases` namespace like every CNPG cluster (its
# volume lands on fast/k8s-db). Restored from the old PG 15 into PG 16 in Phase 5;
# PG 18 since Phase 6 (CNPG's in-place major upgrade: changing the image's
# major triggers pg_upgrade). The `gitea` role's password comes from
# db-credentials.sops.yaml, the same value as the app's credentials.sops.yaml,
# not from CNPG's generated `gitea-app` Secret (it can't cross namespaces).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: gitea
  namespace: databases
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:39add80f5b1e573e2f6b641c66fd1a2f8dede67ca0330e870285bc1078551390
  storage:
    storageClass: fast
    size: 5Gi
  bootstrap:
    initdb:
      database: gitea
      owner: gitea
      secret:
        name: gitea-db
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi
---
# Cluster.spec.monitoring.enablePodMonitor is deprecated; this is its
# replacement. podRole=instance leaves out poolers, should one ever exist.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: gitea
  namespace: databases
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: gitea
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
---
# Ingress only: who may reach this database. Egress stays open, since the
# instance manager talks to the API server (the node's own IP).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gitea
  namespace: databases
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: gitea
  policyTypes: [Ingress]
  ingress:
    # Gitea itself.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gitea
          podSelector:
            matchLabels:
              app.kubernetes.io/name: gitea
      ports:
        - { port: 5432, protocol: TCP }
    # The operator, through the instance manager's status endpoint.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - { port: 8000, protocol: TCP }
    # Prometheus (the PodMonitor above).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - { port: 9187, protocol: TCP }
