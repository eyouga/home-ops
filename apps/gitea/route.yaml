# git.eyouga.fr, as on the old server. LAN only: blocky points
# here, and it isn't on the public listener.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gitea
  namespace: gitea
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames: [git.eyouga.fr]
  rules:
    - backendRefs:
        - name: gitea
          port: 3000
