# Forgejo, ex-Gitea: restored at the old server's Gitea 1.21.3 (Phase 5), then
# switched in place (Phase 6, decided 2026-11-01). Forgejo only migrates from
# Gitea <= 1.22 through v10.0.x, then any later version. Tracks the LTS line.
# Namespace, PVC, database and these names stay `gitea`: renaming them would
# change nothing for anyone and risk the data. Its job: pull mirrors of the
# GitHub repos, as an extra copy; nothing the cluster needs to start may live
# here. Its /data is the rescued /mnt/Bim/apps/gitea, uid 1000 (the
# rootless image's `git` user, not 568). The env below is the old chart's
# gitea-env, so app.ini (/data/gitea/conf/app.ini) and every path in it hold
# unchanged; Forgejo still reads GITEA_*, and its docs ask for FORGEJO_* copies
# in case that ends. The image's entrypoint runs environment-to-ini at each start,
# which writes the GITEA__section__KEY variables into app.ini: the new
# database's address and password (credentials.sops.yaml), and an in-memory
# cache in place of the old memcached.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitea
  namespace: gitea
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      gitea:
        strategy: Recreate
        pod:
          # The issuer it checks is this name, reached through Traefik.
          hostAliases:
            - ip: 192.168.1.201
              hostnames: [auth.eyouga.fr]
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
        containers:
          app:
            image:
              repository: codeberg.org/forgejo/forgejo
              tag: 15.0.11-rootless@sha256:3cd6bc2b74c87cbde0a0fd527c9665cb416f5a0540dee54fe5afb3fa2df9f40c
            env:
              TZ: Europe/Paris
              # The old chart's gitea-env (minus its unused admin bootstrap).
              GITEA_WORK_DIR: /data
              GITEA_CUSTOM: /data/gitea
              GITEA_APP_INI: /data/gitea/conf/app.ini
              FORGEJO_WORK_DIR: /data
              FORGEJO_CUSTOM: /data/gitea
              FORGEJO_APP_INI: /data/gitea/conf/app.ini
              GITEA_TEMP: /tmp/gitea
              TMPDIR: /tmp/gitea
              GNUPGHOME: /data/git/.gnupg
              SSH_PORT: "2222"
              SSH_LISTEN_PORT: "2222"
              # Written into app.ini by environment-to-ini.
              GITEA____APP_NAME: Forgejo
              GITEA__database__HOST: gitea-rw.databases.svc:5432
              GITEA__cache__ADAPTER: memory
              GITEA__cache__HOST: ""
              # Sign-in through Authelia only (its `admins` policy decides who): no
              # password form, no password over basic auth, no OpenID. Access
              # tokens and SSH keys still work, for git. The auth source itself
              # is in the database: `forgejo admin auth add-oauth`, MIGRATION.md.
              GITEA__service__ENABLE_INTERNAL_SIGNIN: "false"
              GITEA__service__ENABLE_BASIC_AUTHENTICATION: "false"
              GITEA__service__DISABLE_REGISTRATION: "false"
              GITEA__service__ALLOW_ONLY_EXTERNAL_REGISTRATION: "true"
              GITEA__service__SHOW_REGISTRATION_BUTTON: "false"
              GITEA__openid__ENABLE_OPENID_SIGNIN: "false"
              GITEA__openid__ENABLE_OPENID_SIGNUP: "false"
              GITEA__oauth2_client__ENABLE_AUTO_REGISTRATION: "true"
              GITEA__oauth2_client__USERNAME: nickname
              GITEA__oauth2_client__ACCOUNT_LINKING: auto
              # Only for `add-oauth` above, read from the pod's environment.
              OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: gitea-oidc
                    key: client-secret
            envFrom:
              # GITEA__database__PASSWD
              - secretRef:
                  name: gitea-db
              # GITEA__security__SECRET_KEY, GITEA__metrics__TOKEN
              - secretRef:
                  name: gitea-secrets
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/healthz
                    port: 3000
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probe
              # Database migrations run before the server listens (Phase 6).
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/healthz
                    port: 3000
                  periodSeconds: 10
                  failureThreshold: 60
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]

    service:
      app:
        controller: gitea
        ports:
          http:
            port: 3000

    serviceMonitor:
      gitea:
        serviceName: gitea
        endpoints:
          - port: http
            path: /metrics
            interval: 1m
            authorization:
              credentials:
                name: gitea-secrets
                key: GITEA__metrics__TOKEN

    persistence:
      data:
        type: persistentVolumeClaim
        storageClass: fast
        accessMode: ReadWriteOnce
        size: 5Gi
        retain: true
        globalMounts:
          - path: /data
      # The image's HOME (/var/lib/gitea/git); scratch, as on the old server.
      varlib:
        type: emptyDir
        globalMounts:
          - path: /var/lib/gitea
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
