# Quality profiles and custom formats as code, synced into Sonarr and Radarr by
# the CronJob in release.yaml. Edit here, push; the next run applies it.
#
# "Small encodes" fits what this library is and what the indexers offer: 2160p
# at 5-7 GB, 1080p under 2 GB, mostly from YTS, the only movie indexer. So no
# TRaSH stock profile (`trash_id:`): those score YTS's groups at -10000 through
# the "LQ" custom format, and Radarr would find nothing. "LQ" and "x265 (HD)" are
# left out on purpose; what's below only rejects releases that are bad whatever
# their size. To go bigger once better indexers exist: swap this profile for a
# guide-backed one (e.g. `trash_id: d1d67249d3890e49bc12e275d989a7e9`, HD
# Bluray + WEB), then re-assign the items in Sonarr/Radarr.
#
# Sizes aren't enforced: nothing here caps a release's size, YTS just doesn't
# publish big ones.
#
# No state between runs (release.yaml), so Recyclarr re-adopts its custom formats
# by name each night (a harmless "already existed ... replaced" warning) and
# can't delete old ones: a format removed from this file stays in the app, with
# its score reset to 0 by reset_unmatched_scores, so it no longer does anything.
radarr:
  radarr_main:
    base_url: http://radarr.radarr.svc:7878
    api_key: !env_var RADARR_API_KEY
    quality_profiles:
      - name: Small encodes
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_quality: Bluray-2160p
        min_format_score: 0
        qualities:
          - name: Bluray-2160p
          - name: WEB 2160p
            qualities:
              - WEBDL-2160p
              - WEBRip-2160p
          - name: Bluray-1080p
          - name: WEB 1080p
            qualities:
              - WEBDL-1080p
              - WEBRip-1080p
    custom_formats:
      - trash_ids:
          - ed38b889b31be83fda192888e2286d83 # BR-DISK
          - e204b80c87be9497a8a6eaff48f72905 # LQ (Release Title)
          - b8cd450cbfa689c0259a01d9e29ba3d6 # 3D
          - 0a3f082873eb454bde444150b70253cc # Extras
          - bfd8eb01832d646a0a89c4deb46f8564 # Upscaled
        assign_scores_to:
          - name: Small encodes
            score: -10000

sonarr:
  sonarr_main:
    base_url: http://sonarr.sonarr.svc:8989
    api_key: !env_var SONARR_API_KEY
    quality_profiles:
      - name: Small encodes
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_quality: Bluray-2160p
        min_format_score: 0
        qualities:
          - name: Bluray-2160p
          - name: WEB 2160p
            qualities:
              - WEBDL-2160p
              - WEBRip-2160p
          - name: Bluray-1080p
          - name: WEB 1080p
            qualities:
              - WEBDL-1080p
              - WEBRip-1080p
    custom_formats:
      - trash_ids:
          - 85c61753df5da1fb2aab6f2a47426b09 # BR-DISK
          - e2315f990da2e2cbfc9fa5b7a6fcfe48 # LQ (Release Title)
          - fbcb31d8dabd2a319072b84fc0b7249c # Extras
          - 23297a736ca77c0fc8e70f8edd7ee56c # Upscaled
        assign_scores_to:
          - name: Small encodes
            score: -10000
