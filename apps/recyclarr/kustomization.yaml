apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - networkpolicy.yaml
  - repository.yaml
  - credentials.sops.yaml
  - release.yaml
# Hashed name, so editing recyclarr.yml upgrades the HelmRelease.
configMapGenerator:
  - name: recyclarr-config
    namespace: recyclarr
    files:
      - config/recyclarr.yml
configurations:
  - kustomizeconfig.yaml
