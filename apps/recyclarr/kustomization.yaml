apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - networkpolicy.yaml
  - repository.yaml
  - credentials.sops.yaml
  - release.yaml
# Hashed name, so editing a file in config/ upgrades the HelmRelease (the next
# sync reads it); kustomizeconfig.yaml carries the hash into it.
configMapGenerator:
  - name: recyclarr-files
    namespace: recyclarr
    files:
      - config/recyclarr.yml
configurations:
  - kustomizeconfig.yaml
