apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - networkpolicy.yaml
  - repository.yaml
  - storage.yaml
  - release.yaml
  - route.yaml
# Hashed name, so editing settings.json upgrades the HelmRelease and rolls
# the pod; kustomizeconfig.yaml carries the hash into it.
configMapGenerator:
  - name: transmission-settings
    namespace: transmission
    files:
      - config/settings.json
configurations:
  - kustomizeconfig.yaml
