# transmission.eyouga.fr. LAN only until Phase 8 (public DNS doesn't point
# here; blocky does). The web UI lives at /transmission/web/.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: transmission
  namespace: transmission
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames: [transmission.eyouga.fr]
  rules:
    - backendRefs:
        - name: transmission
          port: 9091
