# Bulk data on tank: the one `tank/data` dataset (dotfiles' disko-config.nix,
# /srv/data), torrents/<category> and media/{films,series,music} side by side.
# Static PV, so the pods stay on Pod Security `restricted` (a hostPath in the
# pod spec would not). type: Directory: until tank is imported the path is
# missing, so the pod waits instead of writing into the wiped root. Retain:
# deleting these never touches the files. The capacity is a label; nothing
# enforces it.
# Mounted whole, as one /data volume: an import from data/torrents into
# data/media is then a hardlink (link() fails across mounts, EXDEV).
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: transmission-tank-data
spec:
  capacity:
    storage: 2Ti
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: transmission
    name: tank-data
  hostPath:
    path: /srv/data
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tank-data
  namespace: transmission
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: transmission-tank-data
  resources:
    requests:
      storage: 2Ti
