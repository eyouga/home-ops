# Authelia 4.39. Secrets arrive as files: the *_FILE variables in release.yaml,
# and the template filter here for the OIDC key and the clients' digests. That
# filter reads the whole file, comments too: no template syntax in comments.
theme: auto
default_2fa_method: totp

server:
  address: tcp://:9091
  endpoints:
    authz:
      forward-auth:
        implementation: ForwardAuth

log:
  level: info

# It would otherwise ask an NTP server at each start, which only needs an egress
# rule. The host keeps time; TOTP is what would notice if it didn't.
ntp:
  disable_startup_check: true

totp:
  issuer: eyouga.fr

webauthn:
  display_name: eyouga.fr

authentication_backend:
  # users.sops.yaml, read-only here: passwords change there, not in the portal.
  password_reset:
    disable: true
  password_change:
    disable: true
  file:
    path: /users/users.yml
    watch: true

session:
  cookies:
    - domain: eyouga.fr
      authelia_url: https://auth.eyouga.fr
      default_redirection_url: https://eyouga.fr
      inactivity: 1d
      expiration: 1w
      remember_me: 1M

regulation:
  modes: [user, ip]
  max_retries: 5
  find_time: 2m
  ban_time: 15m

storage:
  postgres:
    address: tcp://authelia-rw.databases.svc.cluster.local:5432
    database: authelia
    username: authelia

notifier:
  smtp:
    address: submission://smtp.protonmail.ch:587
    username: auth@eyouga.fr
    sender: Authelia <auth@eyouga.fr>
    subject: "[eyouga.fr] {title}"

# Forward-auth: the routes with an `authelia` Middleware. Anything not listed is
# refused. eyouga needs a second factor, the family a password (their choice,
# 2026-11-02); the family only reaches what's meant for them.
access_control:
  default_policy: deny
  rules:
    - domain: [eyouga.fr, seerr.eyouga.fr]
      subject: group:admins
      policy: two_factor
    - domain: [eyouga.fr, seerr.eyouga.fr]
      subject: group:family
      policy: one_factor
    - domain:
        - sonarr.eyouga.fr
        - radarr.eyouga.fr
        - lidarr.eyouga.fr
        - prowlarr.eyouga.fr
        - transmission.eyouga.fr
        - alertmanager.eyouga.fr
        - prometheus.eyouga.fr
      subject: group:admins
      policy: two_factor

identity_providers:
  oidc:
    jwks:
      - key_id: main
        algorithm: RS256
        use: sig
        key: {{ secret "/secrets/oidc-jwk.pem" | mindent 10 "|" | msquote }}
    # The same rules as above, for the OIDC clients.
    authorization_policies:
      everyone:
        default_policy: deny
        rules:
          - subject: group:admins
            policy: two_factor
          - subject: group:family
            policy: one_factor
      admins:
        default_policy: deny
        rules:
          - subject: group:admins
            policy: two_factor
    clients:
      - client_id: grafana
        client_name: Grafana
        client_secret: '{{ secret "/secrets/oidc-grafana" }}'
        authorization_policy: admins
        consent_mode: implicit
        require_pkce: true
        pkce_challenge_method: S256
        redirect_uris: [https://grafana.eyouga.fr/login/generic_oauth]
        scopes: [openid, profile, email, groups]
        token_endpoint_auth_method: client_secret_basic
      - client_id: forgejo
        client_name: Forgejo
        client_secret: '{{ secret "/secrets/oidc-forgejo" }}'
        authorization_policy: admins
        consent_mode: implicit
        require_pkce: true
        pkce_challenge_method: S256
        redirect_uris: [https://git.eyouga.fr/user/oauth2/authelia/callback]
        scopes: [openid, profile, email, groups]
        token_endpoint_auth_method: client_secret_basic
      - client_id: nextcloud
        client_name: Nextcloud
        client_secret: '{{ secret "/secrets/oidc-nextcloud" }}'
        authorization_policy: everyone
        consent_mode: implicit
        require_pkce: true
        pkce_challenge_method: S256
        redirect_uris: [https://nextcloud.eyouga.fr/apps/user_oidc/code]
        scopes: [openid, profile, email, groups]
        token_endpoint_auth_method: client_secret_post
      - client_id: jellyfin
        client_name: Jellyfin
        client_secret: '{{ secret "/secrets/oidc-jellyfin" }}'
        authorization_policy: everyone
        consent_mode: implicit
        require_pkce: true
        pkce_challenge_method: S256
        redirect_uris: [https://jellyfin.eyouga.fr/sso/OID/redirect/authelia]
        scopes: [openid, profile, groups]
        token_endpoint_auth_method: client_secret_post
      - client_id: home-assistant
        client_name: Home Assistant
        client_secret: '{{ secret "/secrets/oidc-home-assistant" }}'
        authorization_policy: admins
        consent_mode: implicit
        require_pkce: true
        pkce_challenge_method: S256
        redirect_uris: [https://homeassistant.eyouga.fr/auth/oidc/callback]
        scopes: [openid, profile, groups]
        token_endpoint_auth_method: client_secret_post
