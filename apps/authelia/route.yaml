# auth.eyouga.fr: the login page and the OpenID Connect issuer. Apps reach it
# through Traefik like a browser does, on the name in their hostAliases, since
# the issuer they check is this URL.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authelia
  namespace: authelia
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
    # From the internet too (Traefik's release.yaml, and this namespace's label).
    - name: traefik-gateway
      namespace: traefik
      sectionName: public
  hostnames: [auth.eyouga.fr]
  rules:
    - backendRefs:
        - name: authelia
          port: 9091
---
# Traefik watches this namespace for the route, which means reading its Secrets:
# infrastructure/controllers/traefik/rbac.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: traefik-read-secrets
  namespace: authelia
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: traefik-read-secrets
subjects:
  - kind: ServiceAccount
    name: traefik
    namespace: traefik
