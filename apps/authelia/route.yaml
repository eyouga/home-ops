# auth.eyouga.fr: the login page and the OpenID Connect issuer. Apps reach it
# through Traefik like a browser does, on the name in their hostAliases, since
# the issuer they check is this URL.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authelia
  namespace: authelia
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames: [auth.eyouga.fr]
  rules:
    - backendRefs:
        - name: authelia
          port: 9091
