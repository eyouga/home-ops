apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - networkpolicy.yaml
  - repository.yaml
  # The `authelia` role's password, twice: for CNPG in `databases`, and in
  # secrets.sops.yaml for the app. Same value in both. All three files, and the
  # OIDC client secrets the apps hold, come from scripts/authelia-secrets.sh.
  - db-credentials.sops.yaml
  - secrets.sops.yaml
  - users.sops.yaml
  - database.yaml
  - release.yaml
  - route.yaml
# Hashed name, so editing the configuration rolls the pod. That ends everyone's
# session: they live in memory.
configMapGenerator:
  - name: authelia-config
    namespace: authelia
    files:
      - config/configuration.yml
configurations:
  - kustomizeconfig.yaml
