; PHP sessions in Redis, as on the old server (its redis-session.ini). PHP
; expands ${REDIS_PASSWORD} from the environment when it reads this file.
session.save_handler = redis
session.save_path = "tcp://redis.nextcloud.svc:6379?auth=${REDIS_PASSWORD}"
redis.session.locking_enabled = 1
redis.session.lock_retries = -1
redis.session.lock_wait_time = 10000
