# nextcloud.eyouga.fr, as on the old server; nginx in the pod serves it and
# passes /push/ on to notify_push. LAN only until Phase 8 (public DNS
# doesn't point here; blocky does).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames: [nextcloud.eyouga.fr]
  rules:
    - backendRefs:
        - name: nextcloud
          port: 8080
