# nextcloud.eyouga.fr, as on the old server; nginx in the pod serves it and
# passes /push/ on to notify_push.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
    # From the internet too (Traefik's release.yaml, and this namespace's label).
    - name: traefik-gateway
      namespace: traefik
      sectionName: public
  hostnames: [nextcloud.eyouga.fr]
  rules:
    - backendRefs:
        - name: nextcloud
          port: 8080
---
# Traefik watches this namespace for the route, which means reading its Secrets:
# infrastructure/controllers/traefik/rbac.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: traefik-read-secrets
  namespace: nextcloud
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: traefik-read-secrets
subjects:
  - kind: ServiceAccount
    name: traefik
    namespace: traefik
