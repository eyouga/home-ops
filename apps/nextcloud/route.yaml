# nextcloud.eyouga.fr, as on the old server; nginx in the pod serves it and
# passes /push/ on to notify_push.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
    # From the internet too (Traefik's release.yaml, and this namespace's label).
    - name: traefik-gateway
      namespace: traefik
      sectionName: public
  hostnames: [nextcloud.eyouga.fr]
  rules:
    - backendRefs:
        - name: nextcloud
          port: 8080
