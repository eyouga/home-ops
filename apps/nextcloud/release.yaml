# Nextcloud 28.0.2 (Phase 5: restore first, upgrade one major at a time in
# Phase 6). The old image, tccr.io's nextcloud-fpm, is gone; the official
# 28.0.2-fpm is the same release (version.php 28.0.2.5 on both, so its
# entrypoint copies and upgrades nothing). The code is the restored
# nextcloud-html PVC, config.php the restored nextcloud-config PVC, the files
# are on tank (storage.yaml). Everything runs as 568 like on TrueNAS, so
# nothing is chown-ed (the image's www-data is 33).
#
# The old release's parts, and what became of them:
# - fpm + nginx + notify_push: one pod (`nextcloud`), talking over 127.0.0.1;
#   the old nginx.conf (config/). notify_push is the binary shipped in the
#   notify_push app (custom_apps), so it always matches the app's version.
# - cron.php every 5 min and `occ preview:pre-generate` every 30: CronJobs.
# - redis (sessions, locking, cache): Valkey, empty at start, no disk.
# - imaginary: dropped (its image is gone; zz-k8s.config.php).
# - CNPG + its PgBouncer pooler: database.yaml, no pooler.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      nextcloud:
        strategy: Recreate
        pod:
          securityContext: &podsec
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            seccompProfile:
              type: RuntimeDefault
        containers:
          app:
            image: &image
              repository: docker.io/library/nextcloud
              tag: 28.0.2-fpm@sha256:24e3d19ce514f98ccde8e4e69e0ed1703dd2a3c398acbcfd49725b18498fd212
            env: &env
              TZ: Europe/Paris
              # Used by the image's nextcloud.ini (the old chart's values).
              PHP_MEMORY_LIMIT: 1G
              PHP_UPLOAD_LIMIT: 10G
            envFrom: &envFrom
              # NEXTCLOUD_DB_PASSWORD, REDIS_PASSWORD
              - secretRef:
                  name: nextcloud-secrets
            probes:
              liveness: &fpm
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 9000
                  periodSeconds: 30
                  failureThreshold: 5
              readiness: *fpm
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 8Gi
            securityContext: &containersec
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
          nginx:
            image:
              repository: docker.io/nginxinc/nginx-unprivileged
              tag: 1.25.4@sha256:fc4bf78c004581ee6014d9fee0d6825854474c82918465ecb731cc4006a2dad5
            probes:
              liveness: &status
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /status.php
                    port: 8080
                    # One of config.php's trusted_domains.
                    httpHeaders:
                      - name: Host
                        value: localhost
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness: *status
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /status.php
                    port: 8080
                    httpHeaders:
                      - name: Host
                        value: localhost
                  periodSeconds: 10
                  failureThreshold: 60
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 256Mi
            securityContext: *containersec
          push:
            image: *image
            command: [/var/www/html/custom_apps/notify_push/bin/x86_64/notify_push]
            envFrom: *envFrom
            # Everything from here, so notify_push never parses config.php
            # (it can't see zz-k8s.config.php's overrides).
            env:
              PORT: "7867"
              NEXTCLOUD_URL: http://127.0.0.1:8080
              DATABASE_URL: postgres://nextcloud:$(NEXTCLOUD_DB_PASSWORD)@nextcloud-rw.databases.svc/nextcloud
              DATABASE_PREFIX: oc_
              REDIS_URL: redis://:$(REDIS_PASSWORD)@redis.nextcloud.svc
            probes:
              liveness: &push
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 7867
                  periodSeconds: 30
                  failureThreshold: 5
              readiness: *push
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 256Mi
            securityContext: *containersec

      cron:
        type: cronjob
        cronjob:
          # true while restoring; then false.
          suspend: true
          schedule: "*/5 * * * *"
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 3
          backoffLimit: 0
        pod:
          securityContext: *podsec
        containers:
          app:
            image: *image
            command: [php, -f, /var/www/html/cron.php]
            env: *env
            envFrom: *envFrom
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 2Gi
            securityContext: *containersec

      previews:
        type: cronjob
        cronjob:
          suspend: true
          schedule: "*/30 * * * *"
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 3
          backoffLimit: 0
        pod:
          securityContext: *podsec
        containers:
          app:
            image: *image
            command: [php, /var/www/html/occ, preview:pre-generate]
            env: *env
            envFrom: *envFrom
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 4Gi
            securityContext: *containersec

      redis:
        strategy: Recreate
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            seccompProfile:
              type: RuntimeDefault
        containers:
          app:
            image:
              repository: docker.io/valkey/valkey
              tag: 8.1.11-alpine@sha256:2602ace2be6569bc2bbb06f873776516ab9089821525be34f4305c67eb9db02a
            envFrom: *envFrom
            # A cache: nothing written to disk.
            args: [--requirepass, $(REDIS_PASSWORD), --save, "", --appendonly, "no"]
            probes:
              liveness: &valkey
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 6379
                  periodSeconds: 30
                  failureThreshold: 5
              readiness: *valkey
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 512Mi
            securityContext: *containersec

    service:
      nextcloud:
        controller: nextcloud
        forceRename: nextcloud
        ports:
          http:
            port: 8080
      redis:
        controller: redis
        forceRename: redis
        ports:
          redis:
            port: 6379

    persistence:
      config:
        type: persistentVolumeClaim
        storageClass: fast
        accessMode: ReadWriteOnce
        size: 1Gi
        retain: true
        advancedMounts:
          nextcloud:
            app: [{path: /var/www/html/config}]
          cron:
            app: [{path: /var/www/html/config}]
          previews:
            app: [{path: /var/www/html/config}]
      html:
        type: persistentVolumeClaim
        storageClass: fast
        accessMode: ReadWriteOnce
        size: 5Gi
        retain: true
        advancedMounts:
          nextcloud:
            app: [{path: /var/www/html}]
            nginx: [{path: /var/www/html, readOnly: true}]
            push: [{path: /var/www/html, readOnly: true}]
          cron:
            app: [{path: /var/www/html}]
          previews:
            app: [{path: /var/www/html}]
      # config/ (kustomization.yaml generates it; kustomizeconfig.yaml swaps
      # in the hashed name, so an edit rolls the pods).
      files:
        type: configMap
        name: nextcloud-files
        advancedMounts:
          nextcloud:
            app: &phpfiles
              - path: /var/www/html/config/zz-k8s.config.php
                subPath: zz-k8s.config.php
                readOnly: true
              - path: /usr/local/etc/php/conf.d/redis-session.ini
                subPath: redis-session.ini
                readOnly: true
              - path: /usr/local/etc/php/conf.d/opcache-recommended.ini
                subPath: opcache-recommended.ini
                readOnly: true
              - path: /usr/local/etc/php-fpm.d/zz-tune.conf
                subPath: zz-tune.conf
                readOnly: true
            nginx:
              - path: /etc/nginx/nginx.conf
                subPath: nginx.conf
                readOnly: true
          cron:
            app: *phpfiles
          previews:
            app: *phpfiles
      tmp:
        type: emptyDir
        advancedMounts:
          nextcloud:
            app: [{path: /tmp}]
            nginx: [{path: /tmp}]
          cron:
            app: [{path: /tmp}]
          previews:
            app: [{path: /tmp}]
      valkey:
        type: emptyDir
        advancedMounts:
          redis:
            app: [{path: /data}]
      # storage.yaml
      data:
        existingClaim: data
        advancedMounts:
          nextcloud:
            app: [{path: /var/www/html/data}]
          cron:
            app: [{path: /var/www/html/data}]
          previews:
            app: [{path: /var/www/html/data}]
      films:
        existingClaim: films
        advancedMounts:
          nextcloud:
            app: [{path: /media/films}]
          cron:
            app: [{path: /media/films}]
          previews:
            app: [{path: /media/films}]
      series:
        existingClaim: series
        advancedMounts:
          nextcloud:
            app: [{path: /media/series}]
          cron:
            app: [{path: /media/series}]
          previews:
            app: [{path: /media/series}]
      music:
        existingClaim: music
        advancedMounts:
          nextcloud:
            app: [{path: /media/music}]
          cron:
            app: [{path: /media/music}]
          previews:
            app: [{path: /media/music}]
      torrents:
        existingClaim: torrents
        advancedMounts:
          nextcloud:
            app: [{path: /torrents}]
          cron:
            app: [{path: /torrents}]
          previews:
            app: [{path: /torrents}]
