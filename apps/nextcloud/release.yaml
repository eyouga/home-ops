# Nextcloud 28.0.2 (Phase 5: restore first, upgrade one major at a time in
# Phase 6). The old image, tccr.io's nextcloud-fpm, is gone; the official
# 28.0.2-fpm is the same release (version.php 28.0.2.5 on both, so its
# entrypoint copies and upgrades nothing). The code is the restored
# nextcloud-html PVC, config.php the restored nextcloud-config PVC, the files
# are on tank (storage.yaml). Everything runs as 568 like on TrueNAS, so
# nothing is chown-ed (the image's www-data is 33).
#
# The old release's parts, and what became of them:
# - fpm + nginx + notify_push: one pod (`nextcloud`), talking over 127.0.0.1;
#   the old nginx.conf (config/). notify_push is the binary shipped in the
#   notify_push app (custom_apps), so it always matches the app's version.
# - cron.php every 5 min and `occ preview:pre-generate` every 30: CronJobs.
# - redis (sessions, locking, cache): Valkey, empty at start, no disk.
# - imaginary: dropped (its image is gone; zz-k8s.config.php).
# - CNPG + its PgBouncer pooler: database.yaml, no pooler.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      nextcloud:
        strategy: Recreate
        pod:
          # Nextcloud calls its own URL (notify_push's self-test, the admin
          # setup checks). Inside the cluster that name would go to public
          # DNS; this sends it to Traefik, as blocky does on the LAN.
          hostAliases: &hostAliases
            - ip: 192.168.1.201
              hostnames: [nextcloud.eyouga.fr]
          securityContext: &podsec
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            seccompProfile:
              type: RuntimeDefault
        containers:
          app:
            image: &image
              repository: docker.io/library/nextcloud
              tag: 28.0.14-fpm@sha256:f1e48f3f92c3a2d4a710575e3ee1898ce47c6258c76a3dba13c1575e7fa12c00
            env: &env
              TZ: Europe/Paris
              # Used by the image's nextcloud.ini (the old chart's values).
              PHP_MEMORY_LIMIT: 1G
              PHP_UPLOAD_LIMIT: 10G
            envFrom: &envFrom
              # NEXTCLOUD_DB_PASSWORD, REDIS_PASSWORD
              - secretRef:
                  name: nextcloud-secrets
            probes:
              liveness: &fpm
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 9000
                  periodSeconds: 30
                  failureThreshold: 5
              readiness: *fpm
              # On a new image the entrypoint first copies the code into the
              # html PVC and runs `occ upgrade`; fpm only listens after that.
              # Without this the liveness probe would kill it mid-upgrade.
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 9000
                  periodSeconds: 10
                  failureThreshold: 180
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 8Gi
            securityContext: &containersec
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
          nginx:
            image:
              repository: docker.io/nginxinc/nginx-unprivileged
              tag: 1.25.4@sha256:fc4bf78c004581ee6014d9fee0d6825854474c82918465ecb731cc4006a2dad5
            probes:
              liveness: &status
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /status.php
                    port: 8080
                    # One of config.php's trusted_domains.
                    httpHeaders:
                      - name: Host
                        value: localhost
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness: *status
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /status.php
                    port: 8080
                    httpHeaders:
                      - name: Host
                        value: localhost
                  periodSeconds: 10
                  failureThreshold: 60
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 256Mi
            securityContext: *containersec
          push:
            image: *image
            command: [/var/www/html/custom_apps/notify_push/bin/x86_64/notify_push]
            envFrom: *envFrom
            # Everything from here, so notify_push never parses config.php
            # (it can't see zz-k8s.config.php's overrides).
            env:
              PORT: "7867"
              NEXTCLOUD_URL: http://127.0.0.1:8080
              DATABASE_URL: postgres://nextcloud:$(NEXTCLOUD_DB_PASSWORD)@nextcloud-rw.databases.svc/nextcloud
              DATABASE_PREFIX: oc_
              REDIS_URL: redis://:$(REDIS_PASSWORD)@redis.nextcloud.svc
            probes:
              liveness: &push
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 7867
                  periodSeconds: 30
                  failureThreshold: 5
              readiness: *push
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 256Mi
            securityContext: *containersec

      cron:
        type: cronjob
        cronjob:
          # Suspended while the majors are stepped up (Phase 6): a cron.php
          # running while the entrypoint swaps the code could break halfway.
          suspend: &cronSuspend true
          schedule: "*/5 * * * *"
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 3
          backoffLimit: 0
        pod:
          hostAliases: *hostAliases
          securityContext: *podsec
        containers:
          app:
            image: *image
            # k3s's NetworkPolicy controller lets a new pod through about a
            # second after it starts; PHP would connect before that. So
            # wait (30 s at most) until Postgres answers.
            command: &waitdb
              - sh
              - -c
              - |
                i=0
                until php -r 'exit(@fsockopen("nextcloud-rw.databases.svc", 5432, $e, $s, 1) ? 0 : 1);'; do
                  i=$((i+1)); [ "$i" -lt 30 ] || { echo "database unreachable" >&2; exit 1; }; sleep 1
                done
                exec "$@"
              - sh
            args: [php, -f, /var/www/html/cron.php]
            env: *env
            envFrom: *envFrom
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 2Gi
            securityContext: *containersec

      previews:
        type: cronjob
        cronjob:
          suspend: *cronSuspend
          schedule: "*/30 * * * *"
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 3
          backoffLimit: 0
        pod:
          securityContext: *podsec
        containers:
          app:
            image: *image
            command: *waitdb
            args: [php, /var/www/html/occ, preview:pre-generate]
            env: *env
            envFrom: *envFrom
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 4Gi
            securityContext: *containersec

      redis:
        strategy: Recreate
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            seccompProfile:
              type: RuntimeDefault
        containers:
          app:
            image:
              repository: docker.io/valkey/valkey
              tag: 8.1.11-alpine@sha256:2602ace2be6569bc2bbb06f873776516ab9089821525be34f4305c67eb9db02a
            envFrom: *envFrom
            # A cache: nothing written to disk.
            args: [--requirepass, $(REDIS_PASSWORD), --save, "", --appendonly, "no"]
            probes:
              liveness: &valkey
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 6379
                  periodSeconds: 30
                  failureThreshold: 5
              readiness: *valkey
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 512Mi
            securityContext: *containersec

    service:
      nextcloud:
        controller: nextcloud
        forceRename: nextcloud
        ports:
          http:
            port: 8080
      redis:
        controller: redis
        forceRename: redis
        ports:
          redis:
            port: 6379

    persistence:
      config:
        type: persistentVolumeClaim
        storageClass: fast
        accessMode: ReadWriteOnce
        size: 1Gi
        retain: true
        advancedMounts:
          nextcloud:
            app: [{path: /var/www/html/config}]
          cron:
            app: [{path: /var/www/html/config}]
          previews:
            app: [{path: /var/www/html/config}]
      html:
        type: persistentVolumeClaim
        storageClass: fast
        accessMode: ReadWriteOnce
        size: 5Gi
        retain: true
        advancedMounts:
          nextcloud:
            app: [{path: /var/www/html}]
            nginx: [{path: /var/www/html, readOnly: true}]
            push: [{path: /var/www/html, readOnly: true}]
          cron:
            app: [{path: /var/www/html}]
          previews:
            app: [{path: /var/www/html}]
      # config/ (kustomization.yaml generates it; kustomizeconfig.yaml swaps
      # in the hashed name, so an edit rolls the pods).
      files:
        type: configMap
        name: nextcloud-files
        advancedMounts:
          nextcloud:
            app: &phpfiles
              - path: /var/www/html/config/zz-k8s.config.php
                subPath: zz-k8s.config.php
                readOnly: true
              - path: /usr/local/etc/php/conf.d/redis-session.ini
                subPath: redis-session.ini
                readOnly: true
              - path: /usr/local/etc/php/conf.d/opcache-recommended.ini
                subPath: opcache-recommended.ini
                readOnly: true
              - path: /usr/local/etc/php-fpm.d/zz-tune.conf
                subPath: zz-tune.conf
                readOnly: true
            nginx:
              - path: /etc/nginx/nginx.conf
                subPath: nginx.conf
                readOnly: true
          cron:
            app: *phpfiles
          previews:
            app: *phpfiles
      tmp:
        type: emptyDir
        advancedMounts:
          nextcloud:
            app: [{path: /tmp}]
            nginx: [{path: /tmp}]
          cron:
            app: [{path: /tmp}]
          previews:
            app: [{path: /tmp}]
      # nginx.conf's *_temp_path dirs; nginx creates them but not their
      # parent (the old chart's nginx-temp).
      nginx-temp:
        type: emptyDir
        advancedMounts:
          nextcloud:
            nginx: [{path: /tmp/nginx}]
      valkey:
        type: emptyDir
        advancedMounts:
          redis:
            app: [{path: /data}]
      # storage.yaml. Only tank/data's torrents/ is an External Storage
      # mount ("Torrents"); the library (media/) is Jellyfin's, and its files
      # are mostly hardlinks of these anyway ("Media" dropped 2026-11-02).
      # Read-only: Transmission seeds from it, so a rename or delete from
      # Nextcloud would break seeding. The kernel enforces it here; the
      # mount's `readonly` option in Nextcloud (occ files_external:option)
      # only hides the UI's write actions.
      data:
        existingClaim: data
        advancedMounts:
          nextcloud:
            app: [{path: /var/www/html/data}]
          cron:
            app: [{path: /var/www/html/data}]
          previews:
            app: [{path: /var/www/html/data}]
      tank-data:
        existingClaim: tank-data
        advancedMounts:
          nextcloud:
            app: [{path: /torrents, subPath: torrents, readOnly: true}]
          cron:
            app: [{path: /torrents, subPath: torrents, readOnly: true}]
          previews:
            app: [{path: /torrents, subPath: torrents, readOnly: true}]
