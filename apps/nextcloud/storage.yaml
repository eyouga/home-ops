# Bulk data on tank, mounted from the host (datasets in the dotfiles'
# disko-config.nix), as static PVs like the other apps' (Pod Security
# `restricted`, type: Directory so a pod waits for tank instead of writing
# into the wiped root, Retain). `data` is Nextcloud's datadirectory
# (/var/www/html/data, 568:568 770 as on TrueNAS). `tank-data` is the one
# torrents + media dataset (/srv/data); release.yaml mounts only its
# torrents/, read-only at the old path, behind the External Storage mount
# "Torrents" (/torrents). The capacity is a label; nothing enforces it.
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nextcloud-data
spec:
  capacity:
    storage: 2Ti
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: nextcloud
    name: data
  hostPath:
    path: /srv/nextcloud
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: nextcloud
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: nextcloud-data
  resources:
    requests:
      storage: 2Ti
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nextcloud-tank-data
spec:
  capacity:
    storage: 2Ti
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: nextcloud
    name: tank-data
  hostPath:
    path: /srv/data
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tank-data
  namespace: nextcloud
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: nextcloud-tank-data
  resources:
    requests:
      storage: 2Ti
