# Bulk data on tank, mounted from the host (datasets in the dotfiles'
# zfs.nix), as static PVs like the other apps' (Pod Security `restricted`,
# type: Directory so a pod waits for tank instead of writing into the wiped
# root, Retain). `data` is Nextcloud's datadirectory (/var/www/html/data,
# 568:568 770 as on TrueNAS). films/series/music/torrents back the two
# External Storage mounts, "Media" (/media) and "Torrents" (/torrents), at
# the old paths. The capacity is a label; nothing enforces it.
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nextcloud-data
spec:
  capacity:
    storage: 2Ti
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: nextcloud
    name: data
  hostPath:
    path: /srv/nextcloud
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: nextcloud
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: nextcloud-data
  resources:
    requests:
      storage: 2Ti
