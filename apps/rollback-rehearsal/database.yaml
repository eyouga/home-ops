apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: rollback-rehearsal
  namespace: databases
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:39add80f5b1e573e2f6b641c66fd1a2f8dede67ca0330e870285bc1078551390
  storage:
    storageClass: fast
    size: 256Mi
  bootstrap:
    initdb:
      database: rehearsal
      owner: rehearsal
  resources:
    requests:
      cpu: 20m
      memory: 128Mi
    limits:
      memory: 512Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rollback-rehearsal
  namespace: databases
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: rollback-rehearsal
  policyTypes: [Ingress]
  ingress:
    # The operator, through the instance manager's status endpoint.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - { port: 8000, protocol: TCP }
