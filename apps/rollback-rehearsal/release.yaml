# A throwaway app for rehearsing scripts/rollback.sh (MIGRATION.md §10) on no real
# data: a volume, a database, and a "version". Removed after the rehearsal.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rollback-rehearsal
  namespace: rollback-rehearsal
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      rollback-rehearsal:
        strategy: Recreate
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            seccompProfile:
              type: RuntimeDefault
        containers:
          app:
            image:
              repository: ghcr.io/cloudnative-pg/postgresql
              tag: 18.6-standard-trixie@sha256:39add80f5b1e573e2f6b641c66fd1a2f8dede67ca0330e870285bc1078551390
            command: [sh, -c, 'echo "started at $(date) as $VERSION" >>/state/starts.log; exec sleep infinity']
            env:
              VERSION: "2"
            resources:
              requests:
                cpu: 5m
                memory: 8Mi
              limits:
                memory: 32Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
    persistence:
      state:
        type: persistentVolumeClaim
        storageClass: fast
        accessMode: ReadWriteOnce
        size: 16Mi
        retain: true
        globalMounts:
          - path: /state
