# Seerr (Overseerr + Jellyseerr merged, 2026-02), the one request UI: a request
# here goes to Sonarr or Radarr, which grab it. New in Phase 6, nothing to
# restore. Its settings are UI-made (a first-run wizard needing a Jellyfin admin
# login, then settings.json + SQLite in /app/config), hence the PVC. uid 1000,
# the image's `node`.
#
# Upstream asks for an init (`docker run --init`): shareProcessNamespace makes
# the pod's pause process PID 1, which reaps zombies and leaves node's signal
# handling normal.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seerr
  namespace: seerr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      seerr:
        strategy: Recreate
        pod:
          automountServiceAccountToken: false
          shareProcessNamespace: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
        containers:
          app:
            image:
              repository: ghcr.io/seerr-team/seerr
              tag: v3.5.1@sha256:d8fab675b55ad293ded98fd71efcfd46054cbad9746534ae1cc4794a88c0b3be
            env:
              TZ: Europe/Paris
              LOG_LEVEL: info
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/settings/public
                    port: 5055
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probe
              # Database migrations run before the server listens.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/settings/public
                    port: 5055
                  periodSeconds: 10
                  failureThreshold: 60
            resources:
              requests:
                cpu: 20m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]

    service:
      app:
        controller: seerr
        ports:
          http:
            port: 5055

    persistence:
      config:
        type: persistentVolumeClaim
        storageClass: fast
        accessMode: ReadWriteOnce
        size: 1Gi
        retain: true
        globalMounts:
          - path: /app/config
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      nextcache:
        type: emptyDir
        globalMounts:
          - path: /app/.next/cache
