# seerr.eyouga.fr. LAN only until Phase 8 (public DNS doesn't point here;
# blocky does).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: seerr
  namespace: seerr
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames: [seerr.eyouga.fr]
  rules:
    - backendRefs:
        - name: seerr
          port: 5055
