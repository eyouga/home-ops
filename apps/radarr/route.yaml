# radarr.eyouga.fr, as on the old server. LAN only until Phase 8 (public DNS
# doesn't point here; blocky does).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: radarr
  namespace: radarr
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames: [radarr.eyouga.fr]
  rules:
    # Answers only "OK"; homepage's status dot, through Traefik.
    - matches:
        - path:
            type: Exact
            value: /ping
      backendRefs:
        - name: radarr
          port: 7878
    - backendRefs:
        - name: radarr
          port: 7878
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: authelia
---
# Forward-auth: Traefik asks Authelia about each request. A Middleware can only be
# referenced from its own namespace, hence one here. Who gets in is decided in
# apps/authelia/config/configuration.yml.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authelia
  namespace: radarr
spec:
  forwardAuth:
    address: http://authelia.authelia.svc.cluster.local:9091/api/authz/forward-auth
    trustForwardHeader: true
    authResponseHeaders: [Remote-User, Remote-Groups, Remote-Email, Remote-Name]
