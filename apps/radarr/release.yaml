# Radarr, restored at the old server's 5.6.0 (Phase 5), then moved straight
# to current (Phase 6; its SQLite migrates forward on start).
# home-operations builds from the develop channel: pin only builds that are
# also an upstream stable release. Config from the rescued
# /mnt/Bim/apps/Radarr/config; uid 568
# like on TrueNAS, so the restored files need no chown. Since the one-dataset move
# (Phase 6, 2026-11-02) torrents and the library share one /data volume
# (data/torrents/<category>, data/media/films), so imports are hardlinks; the
# root folder and every path in the database were moved there by API.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radarr
  namespace: radarr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      radarr:
        strategy: Recreate
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            seccompProfile:
              type: RuntimeDefault
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/radarr
              tag: 7.0.1.10859@sha256:ffe1f4d7c30b33a1e1256e14ace0eefddf120b37d8defceba208e9c190772f8d
            env:
              # Authelia in front (the route's Middleware), and the NetworkPolicy keeps
              # everything else out but the apps with a rule there.
              RADARR__AUTH__METHOD: External
              RADARR__AUTH__REQUIRED: DisabledForLocalAddresses
              # The route's name and the in-cluster callers' names. Loopback and the
              # pod's own name always pass; the probes below say localhost.
              RADARR__SERVER__ALLOWEDHOSTS: radarr.eyouga.fr,radarr.radarr.svc,radarr.radarr.svc.cluster.local,radarr.radarr,radarr
              TZ: Europe/Paris
              # The image says develop; its "update available" check should
              # follow the stable channel we pin from.
              RADARR__UPDATE__BRANCH: master
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: 7878
                    httpHeaders:
                      - { name: Host, value: localhost }
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probe
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]

    service:
      app:
        controller: radarr
        ports:
          http:
            port: 7878

    persistence:
      config:
        type: persistentVolumeClaim
        storageClass: fast
        accessMode: ReadWriteOnce
        size: 2Gi
        retain: true
        globalMounts:
          - path: /config
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      # storage.yaml
      tank-data:
        existingClaim: tank-data
        globalMounts:
          - path: /data
