# Radarr. Its SQLite migrates forward on start.
# home-operations builds from the develop channel: pin only builds whose
# commit is an upstream stable release (its build number can sit a few below
# upstream's).
# uid 568 owns its config. Torrents and the library share one /data volume
# (data/torrents/<category>, data/media/films), so imports are hardlinks.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radarr
  namespace: radarr
spec:
  interval: 1h
  # The startup probe allows 10 minutes (migrations); 5 more to pull the image.
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      radarr:
        strategy: Recreate
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            seccompProfile:
              type: RuntimeDefault
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/radarr
              tag: 7.0.3.10918@sha256:55d3cf8a4c4c531bb8b5c1ba88eb270d4435e01e228fbdb16cdfc910a17e3b06
            env:
              # Authelia in front (the route's Middleware), and the NetworkPolicy keeps
              # everything else out but the apps with a rule there.
              RADARR__AUTH__METHOD: External
              RADARR__AUTH__REQUIRED: DisabledForLocalAddresses
              # The route's name and the in-cluster callers' names. Loopback and the
              # pod's own name always pass; the probes below say localhost.
              RADARR__SERVER__ALLOWEDHOSTS: radarr.eyouga.fr,radarr.radarr.svc,radarr.radarr.svc.cluster.local,radarr.radarr,radarr
              TZ: Europe/Paris
              # The image says develop; its "update available" check should
              # follow the stable channel we pin from.
              RADARR__UPDATE__BRANCH: master
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: 7878
                    httpHeaders:
                      - { name: Host, value: localhost }
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probe
              # Its SQLite migrates before the server listens.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: 7878
                    httpHeaders:
                      - { name: Host, value: localhost }
                  periodSeconds: 10
                  failureThreshold: 60
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]

    service:
      app:
        controller: radarr
        ports:
          http:
            port: 7878

    persistence:
      config:
        type: persistentVolumeClaim
        storageClass: fast
        accessMode: ReadWriteOnce
        size: 2Gi
        retain: true
        globalMounts:
          - path: /config
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      # storage.yaml
      tank-data:
        existingClaim: tank-data
        globalMounts:
          - path: /data
