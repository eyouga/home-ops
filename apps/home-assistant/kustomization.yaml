apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - networkpolicy.yaml
  - repository.yaml
  # The `home-assistant` role's password, twice: for CNPG in `databases`, and
  # inside the recorder's URL for the app in `home-assistant`. Same value.
  - db-credentials.sops.yaml
  - credentials.sops.yaml
  # The client secret Authelia knows as `home-assistant`.
  - oidc.sops.yaml
  - database.yaml
  - release.yaml
  - route.yaml
# Hashed name, so editing configuration.yaml upgrades the HelmRelease and
# rolls the pod; kustomizeconfig.yaml carries the hash into it.
configMapGenerator:
  - name: home-assistant-files
    namespace: home-assistant
    files:
      - config/configuration.yaml
configurations:
  - kustomizeconfig.yaml
