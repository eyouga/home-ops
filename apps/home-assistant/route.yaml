# homeassistant.eyouga.fr, as on the old server. LAN only: blocky points
# here, and it isn't on the public listener.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames: [homeassistant.eyouga.fr]
  rules:
    - backendRefs:
        - name: home-assistant
          port: 8123
---
# Traefik watches this namespace for the route, which means reading its Secrets:
# infrastructure/controllers/traefik/rbac.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: traefik-read-secrets
  namespace: home-assistant
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: traefik-read-secrets
subjects:
  - kind: ServiceAccount
    name: traefik
    namespace: traefik
