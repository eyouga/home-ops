# homeassistant.eyouga.fr, as on the old server. LAN only: blocky points
# here, and it isn't on the public listener.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames: [homeassistant.eyouga.fr]
  rules:
    - backendRefs:
        - name: home-assistant
          port: 8123
