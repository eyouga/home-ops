# Home Assistant, restored at the old server's 2024.5.5 (Phase 5), then moved
# in ~6-month hops to current (Phase 6: deprecations last about that long).
# /config is the rescued home-assistant-config PVC; the recorder's history is
# in Postgres (database.yaml).
#
# The old pod ran the image's s6-overlay init as root (PUID 568 there is a
# linuxserver convention this image ignores). Here it runs as 568 with a
# read-only root: the command is what s6's home-assistant service ran
# (`python3 -P -m homeassistant --config /config` from /config, mimalloc:
# check /etc/services.d/home-assistant/run on every bump, it changed in
# 2026.10), without s6, which needs root. Tested on an empty /config first:
# it starts clean, and installs nothing (every integration in use ships its
# requirements in the image; anything else would land in /config/deps).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      home-assistant:
        strategy: Recreate
        pod:
          # The Jellyfin integration calls https://jellyfin.eyouga.fr, and
          # auth_oidc checks the issuer at https://auth.eyouga.fr. Inside the
          # cluster those names would go to public DNS; this sends them to
          # Traefik, as blocky does on the LAN.
          hostAliases:
            - ip: 192.168.1.201
              hostnames: [jellyfin.eyouga.fr, auth.eyouga.fr]
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            seccompProfile:
              type: RuntimeDefault
        initContainers:
          # auth_oidc (hass-oidc-auth), a custom integration, at a pinned release.
          # Check it still fits before each Home Assistant bump.
          auth-oidc:
            image: &image
              repository: homeassistant/home-assistant
              tag: 2026.10.4@sha256:23f4dfbb69ce76315dbc4de7915504f1c2dcecd7ca2648113a493a385972e133
            command:
              - python3
              - -B
              - -c
              - |
                import hashlib, io, json, os, shutil, time, urllib.request, zipfile
                VERSION = "1.2.1"
                SHA256 = "e5badaaacaa63cfd6fe733924a05e76d75058836190398598fb24de57cd47ccd"
                URL = f"https://github.com/christiaangoossens/hass-oidc-auth/releases/download/v{VERSION}/hass-oidc-auth.zip"
                TARGET = "/config/custom_components/auth_oidc"
                def installed():
                    try:
                        return json.load(open(TARGET + "/manifest.json"))["version"]
                    except OSError:
                        return None
                if installed() != VERSION:
                    for attempt in range(30):  # kube-router admits a new pod a moment after it starts
                        try:
                            data = urllib.request.urlopen(URL, timeout=30).read()
                            break
                        except OSError as e:
                            print("waiting for the network:", e, flush=True)
                            time.sleep(2)
                    else:
                        raise SystemExit("could not download auth_oidc")
                    if hashlib.sha256(data).hexdigest() != SHA256:
                        raise SystemExit("auth_oidc's checksum doesn't match")
                    shutil.rmtree(TARGET, ignore_errors=True)
                    zipfile.ZipFile(io.BytesIO(data)).extractall(TARGET)
                print("auth_oidc", VERSION, "in place", flush=True)
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
        containers:
          app:
            image: *image
            workingDir: /config
            command: [python3, -P, -m, homeassistant, --config, /config]
            env:
              TZ: Europe/Paris
              # As the image's s6 run script sets them.
              PYTHONMALLOC: mimalloc
              # Read by configuration.yaml's !env_var.
              OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: home-assistant-oidc
                    key: client-secret
            envFrom:
              # HA_RECORDER_DB_URL, read by configuration.yaml's !env_var.
              - secretRef:
                  name: home-assistant-db
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /manifest.json
                    port: 8123
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probe
              # Recorder schema migrations run at start (Phase 6).
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /manifest.json
                    port: 8123
                  periodSeconds: 10
                  failureThreshold: 60
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]

    service:
      app:
        controller: home-assistant
        ports:
          http:
            port: 8123

    persistence:
      config:
        type: persistentVolumeClaim
        storageClass: fast
        accessMode: ReadWriteOnce
        size: 5Gi
        retain: true
        globalMounts:
          - path: /config
      # config/configuration.yaml (kustomization.yaml's configMapGenerator).
      files:
        type: configMap
        name: home-assistant-files
        globalMounts:
          - path: /config/configuration.yaml
            subPath: configuration.yaml
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
