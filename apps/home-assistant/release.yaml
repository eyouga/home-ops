# Home Assistant, upgraded in ~6-month hops (scripts/home-assistant-rung.sh):
# deprecations last about that long. /config is a PVC; the recorder's history is
# in Postgres (database.yaml).
#
# It runs as 568 with a read-only root, without the image's s6-overlay init,
# which needs root: the command is what s6's home-assistant service runs
# (`python3 -P -m homeassistant --config /config` from /config, mimalloc), so
# check /etc/services.d/home-assistant/run on every bump. It installs nothing:
# every integration in use ships its requirements in the image (anything else
# would land in /config/deps).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  interval: 1h
  # The startup probe allows 10 minutes (recorder migrations); 5 more to pull the image.
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      home-assistant:
        strategy: Recreate
        pod:
          # The Jellyfin integration calls https://jellyfin.eyouga.fr, and
          # auth_oidc checks the issuer at https://auth.eyouga.fr. Inside the
          # cluster those names would go to public DNS; this sends them to
          # Traefik, as blocky does on the LAN.
          hostAliases:
            - ip: 192.168.1.201
              hostnames: [jellyfin.eyouga.fr, auth.eyouga.fr]
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            seccompProfile:
              type: RuntimeDefault
        initContainers:
          # config/install-oidc.py: auth_oidc, at its pinned release.
          auth-oidc:
            image: &image
              repository: docker.io/homeassistant/home-assistant
              tag: 2026.11.2@sha256:493a07e8f6530fc640223f4a0a5248f20a61ca2f718bb1d31efbf08a2c5ea28f
            command: [python3, -B, /files/install-oidc.py]
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
        containers:
          app:
            image: *image
            workingDir: /config
            command: [python3, -P, -m, homeassistant, --config, /config]
            env:
              TZ: Europe/Paris
              # As the image's s6 run script sets them.
              PYTHONMALLOC: mimalloc
              # Read by configuration.yaml's !env_var.
              OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: home-assistant-oidc
                    key: client-secret
            envFrom:
              # HA_RECORDER_DB_URL, read by configuration.yaml's !env_var.
              - secretRef:
                  name: home-assistant-db
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /manifest.json
                    port: 8123
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probe
              # Recorder schema migrations run at start.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /manifest.json
                    port: 8123
                  periodSeconds: 10
                  failureThreshold: 60
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]

    service:
      app:
        controller: home-assistant
        ports:
          http:
            port: 8123

    persistence:
      config:
        type: persistentVolumeClaim
        storageClass: fast
        accessMode: ReadWriteOnce
        size: 5Gi
        retain: true
        globalMounts:
          - path: /config
      # config/ (kustomization.yaml's configMapGenerator).
      files:
        type: configMap
        name: home-assistant-files
        advancedMounts:
          home-assistant:
            app:
              - path: /config/configuration.yaml
                subPath: configuration.yaml
                readOnly: true
            auth-oidc:
              - path: /files
                readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
