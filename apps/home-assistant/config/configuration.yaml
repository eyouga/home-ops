# Home Assistant's configuration.yaml, mounted over the restored one (which
# stays untouched on the PVC underneath). It is what the old TrueCharts init
# container left there, minus that container's work at each start (rewriting
# recorder.db_url with yq, re-downloading HACS), with two changes:
# - recorder.db_url comes from the environment (credentials.sops.yaml), so
#   the password stays in SOPS;
# - trusted_proxies is k3s's pod network, where Traefik's pods live
#   (10.42.0.0/16; the old cluster's was 172.16.0.0/16).
# Home Assistant never writes this file; editing it here rolls the pod.

# Configure a default setup of Home Assistant (frontend, api, etc)
default_config:
# Text to speech
tts:
  - platform: google_translate
group: !include groups.yaml
automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
recorder:
  purge_keep_days: 30
  commit_interval: 3
  db_url: !env_var HA_RECORDER_DB_URL
http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 10.42.0.0/16
# Sign-in through Authelia (custom_components/auth_oidc, release.yaml's init
# container); its `admins` policy decides who gets here. The password provider stays
# (without it, this integration's login flow is reported to break), with a random
# password nobody has: `hass --script auth change_password` is the way back in.
auth_oidc:
  client_id: home-assistant
  client_secret: !env_var OIDC_CLIENT_SECRET
  discovery_url: https://auth.eyouga.fr/.well-known/openid-configuration
  display_name: Authelia
  features:
    default_redirect: true
  roles:
    admin: admins
