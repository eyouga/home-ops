# Lidarr, restored at the old server's 2.3.3 (Phase 5, on linuxserver's
# build with s6 bypassed: the old onedr0p image no longer pulls), then moved
# straight to current on home-operations' image (Phase 6; its SQLite
# migrates forward on start). home-operations builds from the develop
# channel: pin only builds whose commit is an upstream stable release
# (3.1.6.5078 = stable 3.1.6.5079). Config from the
# rescued /mnt/Bim/apps/lidarr/config; uid 568 like on TrueNAS, so the
# restored files need no chown. Since the one-dataset
# move (Phase 6, 2026-11-02) torrents and the library share one /data volume
# (data/torrents/<category>, data/media/music), so imports are hardlinks; the
# root folder and every path in the database were moved there by API.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lidarr
  namespace: lidarr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      lidarr:
        strategy: Recreate
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            seccompProfile:
              type: RuntimeDefault
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/lidarr
              tag: 3.2.0.5144@sha256:d460ea8d1a02673c4d82b911acea01d5496ddf2ef28be57d30c60bf208ae6765
            env:
              # Authelia in front (the route's Middleware), and the NetworkPolicy keeps
              # everything else out but the apps with a rule there.
              LIDARR__AUTH__METHOD: External
              LIDARR__AUTH__REQUIRED: DisabledForLocalAddresses
              # The route's name and the in-cluster callers' names. Loopback and the
              # pod's own name always pass; the probes below say localhost.
              LIDARR__SERVER__ALLOWEDHOSTS: lidarr.eyouga.fr,lidarr.lidarr.svc,lidarr.lidarr.svc.cluster.local,lidarr.lidarr,lidarr
              TZ: Europe/Paris
              # The image says develop; its "update available" check should
              # follow the stable channel we pin from.
              LIDARR__UPDATE__BRANCH: master
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: 8686
                    httpHeaders:
                      - { name: Host, value: localhost }
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probe
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]

    service:
      app:
        controller: lidarr
        ports:
          http:
            port: 8686

    persistence:
      config:
        type: persistentVolumeClaim
        storageClass: fast
        accessMode: ReadWriteOnce
        size: 5Gi
        retain: true
        globalMounts:
          - path: /config
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      # storage.yaml
      tank-data:
        existingClaim: tank-data
        globalMounts:
          - path: /data
