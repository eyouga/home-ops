# Lidarr at the old server's exact release (Phase 5: restore first, upgrade
# in Phase 6). The old image (onedr0p/lidarr-develop) no longer pulls; this
# is linuxserver's build of the same 2.3.3.4204, started with Lidarr's own
# binary: its s6 init needs root, the binary doesn't. Config from the
# rescued /mnt/Bim/apps/lidarr/config; uid 568 like on TrueNAS, so the
# restored files need no chown. Paths inside the container match the old
# ones (/media/music, /torrents), so the database's root folder and
# qBittorrent's save paths still hold.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lidarr
  namespace: lidarr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      lidarr:
        strategy: Recreate
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            seccompProfile:
              type: RuntimeDefault
        containers:
          app:
            image:
              repository: lscr.io/linuxserver/lidarr
              tag: 2.3.3.4204-ls169@sha256:20a47bd84783975ad7aa322eee439dee6a097c56d61c28e0f874ea7d87e07793
            command: [/app/lidarr/bin/Lidarr, -nobrowser, -data=/config]
            env:
              TZ: Europe/Paris
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: 8686
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probe
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]

    service:
      app:
        controller: lidarr
        ports:
          http:
            port: 8686

    persistence:
      config:
        type: persistentVolumeClaim
        storageClass: fast
        accessMode: ReadWriteOnce
        size: 5Gi
        retain: true
        globalMounts:
          - path: /config
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      # storage.yaml
      music:
        existingClaim: music
        globalMounts:
          - path: /media/music
      torrents:
        existingClaim: torrents
        globalMounts:
          - path: /torrents
