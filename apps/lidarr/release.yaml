# Lidarr, restored at the old server's 2.3.3 (Phase 5, on linuxserver's
# build with s6 bypassed: the old onedr0p image no longer pulls), then moved
# straight to current on home-operations' image (Phase 6; its SQLite
# migrates forward on start). home-operations builds from the develop
# channel: pin only builds whose commit is an upstream stable release
# (3.1.6.5078 = stable 3.1.6.5079). Config from the
# rescued /mnt/Bim/apps/lidarr/config; uid 568 like on TrueNAS, so the
# restored files need no chown. Paths inside the container match the old
# ones (/media/music, /torrents), so the database's root folder and
# the download client's save paths still hold.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lidarr
  namespace: lidarr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      lidarr:
        strategy: Recreate
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            seccompProfile:
              type: RuntimeDefault
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/lidarr
              tag: 3.1.6.5078@sha256:24dacfbfa34ab6d99d6f0f2060fd8e97d1a8c5e82ff3d85f0e5a4c46bd9a3b2b
            env:
              TZ: Europe/Paris
              # The image says develop; its "update available" check should
              # follow the stable channel we pin from.
              LIDARR__UPDATE__BRANCH: master
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: 8686
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probe
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]

    service:
      app:
        controller: lidarr
        ports:
          http:
            port: 8686

    persistence:
      config:
        type: persistentVolumeClaim
        storageClass: fast
        accessMode: ReadWriteOnce
        size: 5Gi
        retain: true
        globalMounts:
          - path: /config
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      # storage.yaml
      music:
        existingClaim: music
        globalMounts:
          - path: /media/music
      torrents:
        existingClaim: torrents
        globalMounts:
          - path: /torrents
