# lidarr.eyouga.fr, as on the old server. LAN only until Phase 8 (public DNS
# doesn't point here; blocky does).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lidarr
  namespace: lidarr
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames: [lidarr.eyouga.fr]
  rules:
    - backendRefs:
        - name: lidarr
          port: 8686
