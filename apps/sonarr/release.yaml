# Sonarr, restored at the old server's 4.0.4 (Phase 5), then moved straight
# to current (Phase 6; its SQLite migrates forward on start).
# home-operations builds from the develop channel: pin only builds whose
# commit is an upstream stable release (4.0.20.3012 = stable 4.0.20.3014).
# Config from the rescued /mnt/Bim/apps/sonarr/config; uid 568
# like on TrueNAS, so the restored files need no chown. Paths inside the
# container match the old ones (/media/series, /torrents), so the database's
# root folder and qBittorrent's save paths still hold.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sonarr
  namespace: sonarr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      sonarr:
        strategy: Recreate
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            seccompProfile:
              type: RuntimeDefault
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/sonarr
              tag: 4.0.20.3012@sha256:1f19eb5e0f421418c1a956bbe01310a0141423afe28bd9a4b1dcb8629ff2bce2
            env:
              TZ: Europe/Paris
              # The image says develop; its "update available" check should
              # follow the stable channel we pin from.
              SONARR__UPDATE__BRANCH: main
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: 8989
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probe
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]

    service:
      app:
        controller: sonarr
        ports:
          http:
            port: 8989

    persistence:
      config:
        type: persistentVolumeClaim
        storageClass: fast
        accessMode: ReadWriteOnce
        size: 2Gi
        retain: true
        globalMounts:
          - path: /config
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      # storage.yaml
      series:
        existingClaim: series
        globalMounts:
          - path: /media/series
      torrents:
        existingClaim: torrents
        globalMounts:
          - path: /torrents
