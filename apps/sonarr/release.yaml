# Sonarr, restored at the old server's 4.0.4 (Phase 5), then moved straight
# to current (Phase 6; its SQLite migrates forward on start).
# home-operations builds from the develop channel: pin only builds whose
# commit is an upstream stable release (4.0.20.3012 = stable 4.0.20.3014).
# Config from the rescued /mnt/Bim/apps/sonarr/config; uid 568
# like on TrueNAS, so the restored files need no chown. Since the one-dataset move
# (Phase 6, 2026-11-02) torrents and the library share one /data volume
# (data/torrents/<category>, data/media/series), so imports are hardlinks; the
# root folder and every path in the database were moved there by API.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sonarr
  namespace: sonarr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      sonarr:
        strategy: Recreate
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            seccompProfile:
              type: RuntimeDefault
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/sonarr
              tag: 5.0.0.2941@sha256:93b0923dd12afd43247739e19dac59d74c52a15ea12e036b7ced264cffb42574
            env:
              # Authelia in front (the route's Middleware), and the NetworkPolicy keeps
              # everything else out but the apps with a rule there.
              SONARR__AUTH__METHOD: External
              SONARR__AUTH__REQUIRED: DisabledForLocalAddresses
              # The route's name and the in-cluster callers' names. Loopback and the
              # pod's own name always pass; the probes below say localhost.
              SONARR__SERVER__ALLOWEDHOSTS: sonarr.eyouga.fr,sonarr.sonarr.svc,sonarr.sonarr.svc.cluster.local,sonarr.sonarr,sonarr
              TZ: Europe/Paris
              # The image says develop; its "update available" check should
              # follow the stable channel we pin from.
              SONARR__UPDATE__BRANCH: main
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: 8989
                    httpHeaders:
                      - { name: Host, value: localhost }
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probe
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]

    service:
      app:
        controller: sonarr
        ports:
          http:
            port: 8989

    persistence:
      config:
        type: persistentVolumeClaim
        storageClass: fast
        accessMode: ReadWriteOnce
        size: 2Gi
        retain: true
        globalMounts:
          - path: /config
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      # storage.yaml
      tank-data:
        existingClaim: tank-data
        globalMounts:
          - path: /data
