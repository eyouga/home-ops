# sonarr.eyouga.fr, as on the old server. LAN only: blocky points
# here, and it isn't on the public listener.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sonarr
  namespace: sonarr
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames: [sonarr.eyouga.fr]
  rules:
    # Answers only "OK"; homepage's status dot, through Traefik.
    - matches:
        - path:
            type: Exact
            value: /ping
      backendRefs:
        - name: sonarr
          port: 8989
    - backendRefs:
        - name: sonarr
          port: 8989
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: authelia
---
# Forward-auth: Traefik asks Authelia about each request. A Middleware can only be
# referenced from its own namespace, hence one here. Who gets in is decided in
# apps/authelia/config/configuration.yml.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authelia
  namespace: sonarr
spec:
  forwardAuth:
    address: http://authelia.authelia.svc.cluster.local:9091/api/authz/forward-auth
    trustForwardHeader: true
    authResponseHeaders: [Remote-User, Remote-Groups, Remote-Email, Remote-Name]
