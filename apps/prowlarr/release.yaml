# Prowlarr, restored at the old server's 1.17.2 (Phase 5), then moved
# straight to current (Phase 6; its SQLite migrates forward on start).
# home-operations builds from the develop channel: pin only builds that are
# also an upstream stable release. Config from the rescued
# /mnt/Bim/apps/prowlarr/config; uid 568 like on TrueNAS, so the restored
# files need no chown. The old chart also mounted media and torrents;
# Prowlarr never reads them.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prowlarr
  namespace: prowlarr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      prowlarr:
        strategy: Recreate
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            seccompProfile:
              type: RuntimeDefault
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/prowlarr
              tag: 3.0.0.5737@sha256:0954599432e16ccd86129f1eb8eb0247fd0d1591aab400f73e2010a1cda37be8
            env:
              # Authelia in front (the route's Middleware), and the NetworkPolicy keeps
              # everything else out but the apps with a rule there.
              PROWLARR__AUTH__METHOD: External
              PROWLARR__AUTH__REQUIRED: DisabledForLocalAddresses
              # The route's name and the in-cluster callers' names. Loopback and the
              # pod's own name always pass; the probes below say localhost.
              PROWLARR__SERVER__ALLOWEDHOSTS: prowlarr.eyouga.fr,prowlarr.prowlarr.svc,prowlarr.prowlarr.svc.cluster.local,prowlarr.prowlarr,prowlarr
              TZ: Europe/Paris
              # The image says develop; its "update available" check should
              # follow the stable channel we pin from.
              PROWLARR__UPDATE__BRANCH: master
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: 9696
                    httpHeaders:
                      - { name: Host, value: localhost }
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probe
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]

    service:
      app:
        controller: prowlarr
        ports:
          http:
            port: 9696

    persistence:
      config:
        type: persistentVolumeClaim
        storageClass: fast
        accessMode: ReadWriteOnce
        size: 1Gi
        retain: true
        globalMounts:
          - path: /config
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
