# prowlarr.eyouga.fr, as on the old server. LAN only until Phase 8 (public DNS
# doesn't point here; blocky does).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prowlarr
  namespace: prowlarr
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames: [prowlarr.eyouga.fr]
  rules:
    - backendRefs:
        - name: prowlarr
          port: 9696
