# Prometheus and Alertmanager, for their own UIs. LAN only, behind Authelia.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authelia
  namespace: monitoring
spec:
  forwardAuth:
    address: http://authelia.authelia.svc.cluster.local:9091/api/authz/forward-auth
    trustForwardHeader: true
    authResponseHeaders: [Remote-User, Remote-Groups, Remote-Email, Remote-Name]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus
  namespace: monitoring
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames: [prometheus.eyouga.fr]
  rules:
    # Homepage's status dot, through Traefik.
    - matches:
        - path:
            type: Exact
            value: /-/healthy
      backendRefs:
        - name: kube-prometheus-stack-prometheus
          port: 9090
    - backendRefs:
        - name: kube-prometheus-stack-prometheus
          port: 9090
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: authelia
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames: [alertmanager.eyouga.fr]
  rules:
    # Homepage's status dot, through Traefik.
    - matches:
        - path:
            type: Exact
            value: /-/healthy
      backendRefs:
        - name: kube-prometheus-stack-alertmanager
          port: 9093
    - backendRefs:
        - name: kube-prometheus-stack-alertmanager
          port: 9093
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: authelia
