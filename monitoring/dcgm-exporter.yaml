# The RTX 2070: utilization, encoder/decoder load (Jellyfin transcodes),
# temperature, power, memory. NVIDIA's own exporter (DCGM).
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: dcgm-exporter
  namespace: monitoring
spec:
  interval: 24h
  url: https://nvidia.github.io/dcgm-exporter/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dcgm-exporter
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: dcgm-exporter
      version: 4.8.4 # DCGM 4.6.1, exporter 4.8.4
      sourceRef:
        kind: HelmRepository
        name: dcgm-exporter
  values:
    # Sees the GPU without claiming it (no nvidia.com/gpu request), so
    # Jellyfin can still have it.
    runtimeClassName: nvidia-cdi
    extraEnv:
      - name: NVIDIA_VISIBLE_DEVICES
        value: all
    serviceMonitor:
      enabled: true
