apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - repository.yaml
  - grafana-admin.sops.yaml
  - alertmanager-ntfy.sops.yaml
  - alertmanager-healthchecks.sops.yaml
  - kube-prometheus-stack.yaml
  - smartctl-exporter.yaml
  - dcgm-exporter.yaml
  - rules/storage.yaml
  - rules/flux.yaml
  - rules/backup.yaml
  - dashboards
  - flux.yaml
# Hashed name, so editing the values upgrades the HelmRelease;
# kustomizeconfig.yaml carries the hash into its valuesFrom.
configMapGenerator:
  - name: flux-state-metrics
    namespace: monitoring
    files: [flux-state-metrics.yaml]
configurations:
  - kustomizeconfig.yaml
