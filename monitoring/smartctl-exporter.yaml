# Disk health for all six drives: IronWolf reallocated/pending sectors,
# Kingston SSD wear, the NVMe's spare and media errors. Privileged, with the
# host's /dev: smartctl needs raw device access.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: smartctl-exporter
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: prometheus-smartctl-exporter
      version: 0.19.1 # exporter v0.15.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  values:
    serviceMonitor:
      enabled: true
      # instance = <host IP>:<port> like node-exporter's, instead of the pod
      # IP: stable across restarts, and the ZFS dashboard joins SMART series
      # to node-exporter's by host IP.
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_host_ip, __address__]
          regex: '(.+);.+:(\d+)'
          replacement: '${1}:${2}'
          targetLabel: instance
    prometheusRules:
      enabled: true
    common:
      config:
        # Never spin up a sleeping disk just to read its counters.
        smartctl_powermode_check: standby
