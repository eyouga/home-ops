apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb-system
spec:
  interval: 1h
  chart:
    spec:
      chart: metallb
      version: 0.16.2
      sourceRef:
        kind: HelmRepository
        name: metallb
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  # The status cleaner runs on the host's network with a fixed port, so on one node a
  # rolling update's new pod waits for ever for the old one's port. No surge stops
  # the old pod first. Not Recreate: Helm applies server-side and keeps the live
  # rollingUpdate, which Recreate refuses.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: metallb-frr-k8s-statuscleaner
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: metallb-frr-k8s-statuscleaner
              spec:
                strategy:
                  type: RollingUpdate
                  rollingUpdate:
                    maxSurge: 0
                    maxUnavailable: 1
  values:
    # Metrics are HTTPS behind a TokenReview/SubjectAccessReview: Prometheus
    # scrapes with its service-account token, whose ClusterRole already
    # allows GET /metrics. Rules: pool usage/exhaustion, stale or unloaded
    # config (BGP session rule too, inert in L2 mode).
    prometheus:
      # Its Role would let Prometheus list pods/endpoints here, which
      # kube-prometheus-stack's ClusterRole already does.
      rbacPrometheus: false
      serviceMonitor:
        enabled: true
      prometheusRule:
        enabled: true
