apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb-system
spec:
  interval: 1h
  chart:
    spec:
      chart: metallb
      version: 0.16.1
      sourceRef:
        kind: HelmRepository
        name: metallb
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    # Metrics are HTTPS behind a TokenReview/SubjectAccessReview: Prometheus
    # scrapes with its service-account token, whose ClusterRole already
    # allows GET /metrics. Rules: pool usage/exhaustion, stale or unloaded
    # config (BGP session rule too, inert in L2 mode).
    prometheus:
      serviceMonitor:
        enabled: true
      prometheusRule:
        enabled: true
