apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
  namespace: cnpg-system
spec:
  interval: 1h
  chart:
    spec:
      chart: cloudnative-pg
      version: 0.29.2 # operator 1.30.1
      sourceRef:
        kind: HelmRepository
        name: cnpg
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    # The operator's own metrics. Each database.yaml carries its own PodMonitor.
    monitoring:
      podMonitorEnabled: true
      # The CNPG dashboard, loaded by Grafana's sidecar from any namespace.
      grafanaDashboard:
        create: true
