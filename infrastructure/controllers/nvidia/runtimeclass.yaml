# The GPU through CDI. The host (k3s) registers the `nvidia-cdi` containerd
# handler when nvidia-container-runtime.cdi is in its PATH, but k3s's bundled
# RuntimeClasses stop at `nvidia`, whose legacy runtime the host doesn't have.
# A pod with this class and NVIDIA_VISIBLE_DEVICES set gets those GPUs from
# the host's CDI spec (/var/run/cdi). Pods that need the GPU exclusively ask
# for `nvidia.com/gpu: 1` too; the device plugin then sets the variable.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: nvidia-cdi
handler: nvidia-cdi
