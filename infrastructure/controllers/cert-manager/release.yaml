apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 1h
  chart:
    spec:
      chart: cert-manager
      version: v1.21.3
      sourceRef:
        kind: HelmRepository
        name: jetstack
  values:
    crds:
      enabled: true
      # Uninstalling the chart must not delete every Certificate with it.
      keep: true
    # DNS-01 self-checks ask public resolvers, never the LAN's: blocky will
    # answer eyouga.fr locally (split horizon) and never sees the TXT record.
    dns01RecursiveNameservers: 1.1.1.1:53,9.9.9.9:53
    dns01RecursiveNameserversOnly: true
    prometheus:
      servicemonitor:
        enabled: true
