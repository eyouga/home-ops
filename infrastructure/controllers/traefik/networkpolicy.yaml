# Default deny, then the real paths: clients to the entry points, Prometheus to
# the metrics; Traefik to DNS, the API server and the namespaces it routes to.
# Nothing to the internet or the LAN. The dashboard and ping (8080) get no rule:
# the kubelet's probes come from the node, which is always let in.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: traefik
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: traefik
  namespace: traefik
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: traefik
  policyTypes: [Ingress, Egress]
  ingress:
    # web, websecure and public, from anywhere: the Service keeps the client's
    # address (externalTrafficPolicy: Local), and pods come through here too.
    - ports:
        - { port: 8000, protocol: TCP }
        - { port: 8443, protocol: TCP }
        - { port: 8444, protocol: TCP }
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - { port: 9100, protocol: TCP }
  egress:
    # kube-dns, for Authelia's address in the forward-auth Middlewares.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    # The API server, as the policy sees it after the kubernetes Service's DNAT:
    # the node's address.
    - to:
        - ipBlock:
            cidr: 192.168.1.80/32
      ports:
        - { port: 6443, protocol: TCP }
    # The namespaces it watches (release.yaml), less its own. Any port: each
    # app's own policy says which of its ports Traefik may reach.
    - to:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - authelia
                  - gitea
                  - home-assistant
                  - homepage
                  - jellyfin
                  - lidarr
                  - monitoring
                  - nextcloud
                  - prowlarr
                  - radarr
                  - seerr
                  - sonarr
                  - transmission
