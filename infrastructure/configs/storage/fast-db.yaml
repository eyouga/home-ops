# CNPG volumes: dataset fast/k8s-db (recordsize 16K, for Postgres's 8K pages),
# mounted at /var/lib/k8s-volumes/_db. local-path only serves base paths from
# k3s's own config, so this reaches the dataset through pathPattern instead.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: fast-db
provisioner: rancher.io/local-path
parameters:
  pathPattern: "_db/{{ .PVC.Namespace }}/{{ .PVC.Name }}"
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
