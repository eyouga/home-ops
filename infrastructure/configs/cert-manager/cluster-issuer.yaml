# `cert`, as on the old cluster. DNS-01 through Cloudflare, so wildcards work
# and nothing has to be reachable from the internet to get a certificate.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: cert
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: cert-acme-account
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
