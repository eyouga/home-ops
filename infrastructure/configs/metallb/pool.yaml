# Same pool as the old TrueNAS cluster; outside the router's DHCP range.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: apps
  namespace: metallb-system
spec:
  addresses:
    - 192.168.1.201-192.168.1.250
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: apps
  namespace: metallb-system
spec:
  ipAddressPools:
    - apps
